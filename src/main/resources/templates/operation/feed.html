<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{operation.title} + ' · ' + #{app.name}">Операции</title></head>
<body>
<main class="container py-3">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="h4 mb-0" th:text="#{operation.title}">Операции</h1>
    <a class="btn btn-primary btn-sm" th:href="@{/quick}" th:text="'+ ' + #{nav.add}">+ Добавить</a>
  </div>

  <form id="filters" class="row g-2 mb-3" th:object="${filter}" method="get" th:action="@{/operations}"
        hx-get="/operations" hx-target="#results" hx-swap="outerHTML" hx-push-url="true"
        hx-trigger="change, input from:#q delay:300ms">
    <div class="col-6 col-md-2">
      <input class="form-control form-control-sm" type="date" th:field="*{from}" th:attr="aria-label=#{operation.filter.from}">
    </div>
    <div class="col-6 col-md-2">
      <input class="form-control form-control-sm" type="date" th:field="*{to}" th:attr="aria-label=#{operation.filter.to}">
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select form-select-sm" th:field="*{accountId}" th:attr="aria-label=#{operation.account}">
        <option value="" th:text="#{operation.account} + ': ' + #{operation.filter.all}">Счёт: все</option>
        <option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.name}">Карта</option>
      </select>
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select form-select-sm" th:field="*{categoryId}" th:attr="aria-label=#{operation.category}">
        <option value="" th:text="#{operation.category} + ': ' + #{operation.filter.all}">Категория: все</option>
        <optgroup th:each="entry : ${categoryOptions}" th:attr="label=#{'category.kind.' + ${entry.key}}">
          <option th:each="c : ${entry.value}" th:value="${c.id}"
                  th:text="${c.parentId == null} ? ${c.icon} + ' ' + ${c.name} : '— ' + ${c.name}">Еда</option>
        </optgroup>
      </select>
    </div>
    <div class="col-6 col-md-1">
      <select class="form-select form-select-sm" th:field="*{type}" th:attr="aria-label=#{operation.filters}">
        <option value="" th:text="#{operation.filter.all}">Все</option>
        <option th:each="t : ${types}" th:value="${t}" th:text="#{'operation.type.' + ${t}}">Расход</option>
      </select>
    </div>
    <div class="col-6 col-md-3 d-flex gap-2">
      <input class="form-control form-control-sm" id="q" name="q" th:value="*{q}" type="search"
             th:placeholder="#{operation.filter.query}">
      <a class="btn btn-sm btn-link" th:if="${filter.active}" th:href="@{/operations}" th:text="#{operation.filter.reset}">Сбросить</a>
    </div>
  </form>

  <div id="results" th:fragment="results">
    <p class="text-body-secondary py-4 text-center" th:if="${feed.empty}"
       th:text="${filter != null and filter.active} ? #{operation.feed.emptyFiltered} : #{operation.feed.empty}">Операций пока нет.</p>
    <th:block th:fragment="days">
      <section class="mb-3" th:each="day : ${feed.days}">
        <div class="d-flex justify-content-between align-items-baseline px-1 py-2 small text-body-secondary day-header">
          <span class="fw-semibold" th:text="${#temporals.format(day.date, 'd MMMM, EEEE')}">11 октября, суббота</span>
          <span class="font-monospace text-end">
            <span th:each="t : ${day.expenses}" class="ms-2" th:text="${@money.format(t.value, t.key)}">−85,40 BYN</span>
            <span th:each="t : ${day.income}" class="ms-2 amount-positive" th:text="${@money.signed(t.value, t.key)}">+3 200,00 BYN</span>
          </span>
        </div>
        <div class="list-group">
          <a class="list-group-item list-group-item-action d-flex gap-3 align-items-center py-2" th:each="item : ${day.items}"
             th:href="@{/operations/{id}/edit(id=${item.id})}">
            <span class="cat-icon flex-shrink-0" th:style="'--cat-color:' + ${item.color}" th:text="${item.icon}">🍽️</span>
            <span class="flex-grow-1 min-w-0">
              <span class="d-block text-truncate" th:text="${item.title}">Еда › Продукты</span>
              <span class="d-block small text-body-secondary text-truncate" th:if="${item.details != null}" th:text="${item.details}">Карта BYN</span>
            </span>
            <span class="text-end font-monospace flex-shrink-0">
              <span class="d-block" th:each="m : ${item.amounts}"
                    th:classappend="${m.amount.signum() > 0} ? 'amount-positive'"
                    th:text="${@money.signed(m.amount, m.currency)}">−85,40 BYN</span>
              <span class="d-block small text-body-secondary" th:if="${item.original != null}" th:text="${item.original}">20,00 USD</span>
              <span class="d-block small text-body-secondary" th:if="${item.balanceAfter != null}"
                    th:text="#{operation.balanceAfter} + ' ' + ${@money.format(item.balanceAfter, item.amounts[0].currency)}">остаток 1 200,00 BYN</span>
            </span>
          </a>
        </div>
      </section>
      <div th:if="${feed.nextBefore != null}" class="text-center text-body-secondary small py-3"
           th:attr="hx-get=${pageUrl + '&before=' + feed.nextBefore}" hx-trigger="revealed" hx-swap="outerHTML"
           th:text="#{operation.feed.loading}">Загружаю…</div>
    </th:block>
  </div>
</main>
</body>
</html>
