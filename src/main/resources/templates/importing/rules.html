<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{import.rules} + ' · ' + #{app.name}">Правила</title></head>
<body>
<main class="container py-3 narrow-container">
  <p class="small text-body-secondary mb-1"><a th:href="@{/import}" th:text="#{import.title}">Импорт</a></p>
  <h1 class="h4 mb-2" th:text="#{import.rules}">Правила</h1>
  <p class="small text-body-secondary" th:text="#{rules.hint}">Если описание операции содержит текст — ставим категорию.</p>

  <form class="row g-2 align-items-end mb-4" method="post" th:action="@{/import/rules}">
    <div class="col-12 col-sm-5">
      <label class="form-label small" for="pattern" th:text="#{rules.pattern}">Текст в описании</label>
      <input class="form-control" id="pattern" name="pattern" maxlength="100" required placeholder="Евроопт">
    </div>
    <div class="col-8 col-sm-5">
      <label class="form-label small" for="categoryId" th:text="#{operation.category}">Категория</label>
      <select class="form-select" id="categoryId" name="categoryId">
        <option th:each="c : ${options}" th:value="${c.id}"
                th:text="(${c.kind.name() == 'INCOME'} ? '↓ ' : '') + (${c.parentId == null} ? ${c.icon} + ' ' + ${c.name} : '— ' + ${c.name})">Еда</option>
      </select>
    </div>
    <div class="col-4 col-sm-2">
      <button class="btn btn-primary w-100" type="submit" th:text="#{common.save}">Сохранить</button>
    </div>
  </form>

  <p class="text-body-secondary" th:if="${rules.empty}" th:text="#{rules.empty}">Правил пока нет.</p>
  <ul class="list-group" th:unless="${rules.empty}">
    <li class="list-group-item d-flex align-items-center gap-2" th:each="r : ${rules}">
      <span class="font-monospace flex-grow-1 text-truncate" th:text="'«' + ${r.pattern} + '»'">«Евроопт»</span>
      <span class="small text-nowrap" th:text="'→ ' + (${categories[r.categoryId] != null} ? ${categories[r.categoryId].displayName()} : '?')">→ Еда › Продукты</span>
      <form method="post" th:action="@{/import/rules/{id}/delete(id=${r.id})}">
        <button class="btn btn-sm btn-link text-body-secondary" type="submit" th:attr="aria-label=#{common.delete}">×</button>
      </form>
    </li>
  </ul>
</main>
</body>
</html>
