<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <title th:replace="${title}">Spendings</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/theme.js}"></script>
  <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
  <script defer th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
  <script defer th:src="@{/webjars/sortablejs/Sortable.min.js}"></script>
  <script defer th:src="@{/webjars/echarts/dist/echarts.min.js}"></script>
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/js/charts.js}"></script>
  <script defer th:src="@{/js/operation-form.js}"></script>
  <script defer th:src="@{/webjars/alpinejs/dist/cdn.min.js}"></script>
</head>
<body hx-boost="true">
  <nav class="navbar border-bottom bg-body-tertiary" th:if="${currentUsername != null}">
    <div class="container gap-2 flex-nowrap">
      <a class="navbar-brand fw-semibold me-2" th:href="@{/}" th:text="#{app.name}">Spendings</a>
      <ul class="navbar-nav flex-row gap-3 me-auto overflow-x-auto app-nav">
        <li class="nav-item"><a class="nav-link" th:href="@{/operations}" th:text="#{nav.operations}">Операции</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/accounts}" th:text="#{nav.accounts}">Счета</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/goals}" th:text="#{nav.goals}">Цели</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/planning}" th:text="#{nav.planning}">План</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/budgets}" th:text="#{nav.budgets}">Бюджеты</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/reports}" th:text="#{nav.reports}">Отчёты</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/categories}" th:text="#{nav.categories}">Категории</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/import}" th:text="#{nav.import}">Импорт</a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/inbox}"><span th:text="#{nav.inbox}">Входящие</span> <span class="badge rounded-pill text-bg-warning" th:if="${inboxCount != null and inboxCount > 0}" th:text="${inboxCount}">3</span></a></li>
        <li class="nav-item"><a class="nav-link" th:href="@{/settings}" th:text="#{nav.settings}">Настройки</a></li>
      </ul>
      <a class="btn btn-primary btn-sm d-none d-md-inline-block" th:href="@{/quick}" th:text="'+ ' + #{nav.add}">+ Добавить</a>
      <form class="d-flex align-items-center gap-2" th:action="@{/logout}" method="post" hx-boost="false">
        <span class="text-body-secondary small d-none d-lg-inline" th:text="${currentUsername}">owner</span>
        <button class="btn btn-outline-secondary btn-sm" type="submit" th:text="#{nav.logout}">Выйти</button>
      </form>
    </div>
  </nav>

  <main th:replace="${content}"></main>

  <a class="btn btn-primary rounded-circle shadow app-fab d-md-none" th:if="${currentUsername != null}"
     th:href="@{/quick}" th:attr="aria-label=#{nav.add}">+</a>

  <div id="flash-toast" hidden th:if="${toast != null}"
       th:attr="data-message=${toast},data-level=${toastLevel ?: 'success'}"></div>
  <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3" id="toasts" aria-live="polite"></div>
</body>
</html>
