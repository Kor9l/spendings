<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:fragment="page(title, content)">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
  <title th:replace="${title}">Spendings</title>
  <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/dist/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
  <script th:src="@{/js/theme.js}"></script>
  <script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
  <script defer th:src="@{/webjars/bootstrap/dist/js/bootstrap.bundle.min.js}"></script>
  <script defer th:src="@{/js/app.js}"></script>
  <script defer th:src="@{/webjars/alpinejs/dist/cdn.min.js}"></script>
</head>
<body hx-boost="true">
  <nav class="navbar navbar-expand border-bottom bg-body-tertiary" th:if="${currentUsername != null}">
    <div class="container">
      <a class="navbar-brand fw-semibold" th:href="@{/}" th:text="#{app.name}">Spendings</a>
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" th:href="@{/}" th:text="#{nav.dashboard}">Дашборд</a></li>
      </ul>
      <form class="d-flex align-items-center gap-2" th:action="@{/logout}" method="post" hx-boost="false">
        <span class="text-body-secondary small d-none d-sm-inline" th:text="${currentUsername}">owner</span>
        <button class="btn btn-outline-secondary btn-sm" type="submit" th:text="#{nav.logout}">Выйти</button>
      </form>
    </div>
  </nav>

  <main th:replace="${content}"></main>

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" aria-live="polite"></div>
</body>
</html>
