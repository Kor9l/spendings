version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*"]
    ignore:
      # htmx 4 несовместим с 2.x по атрибутам и событиям — переходим отдельной задачей
      - dependency-name: "org.webjars.npm:htmx.org"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
