<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page(~{::title}, ~{::main})}">
<head><title th:text="#{dashboard.title} + ' · ' + #{app.name}">Дашборд</title></head>
<body>
<main class="container py-4">
  <h1 class="h4 mb-4" th:text="#{dashboard.greeting(${currentUsername})}">Здравствуйте</h1>

  <section class="card mb-4" th:if="${balances.empty}">
    <div class="card-body">
      <h2 class="h5" th:text="#{dashboard.noAccounts.title}">Начнём со счёта</h2>
      <p class="text-body-secondary" th:text="#{dashboard.noAccounts.text}">Создайте счёт.</p>
      <a class="btn btn-primary" th:href="@{/accounts/new}" th:text="#{operation.createAccount}">Создать счёт</a>
    </div>
  </section>

  <div class="row g-4" th:unless="${balances.empty}">
    <div class="col-12 col-lg-7">
      <div class="d-flex justify-content-between align-items-baseline mb-2">
        <h2 class="h6 text-body-secondary text-uppercase small mb-0" th:text="#{dashboard.recent}">Последние операции</h2>
        <a class="small" th:href="@{/operations}" th:text="#{dashboard.allOperations}">Все операции</a>
      </div>
      <p class="text-body-secondary" th:if="${feed.empty}" th:text="#{operation.feed.empty}">Операций пока нет.</p>
      <th:block th:replace="~{operation/feed :: days}"></th:block>
    </div>

    <div class="col-12 col-lg-5 vstack gap-3">
      <section class="card">
        <div class="card-body">
          <h2 class="h6 text-body-secondary text-uppercase small" th:text="#{dashboard.accounts}">Счета</h2>
          <ul class="list-unstyled mb-0 vstack gap-2">
            <li class="d-flex justify-content-between gap-2" th:each="b : ${balances}">
              <a class="text-body text-decoration-none text-truncate" th:href="@{/accounts/{id}(id=${b.account.id})}"
                 th:text="${b.account.icon} + ' ' + ${b.account.name}">💳 Карта</a>
              <span class="font-monospace text-nowrap" th:classappend="${b.balance.signum() < 0} ? 'amount-negative'"
                    th:text="${@money.format(b.balance, b.account.currency)}">1 200,00 BYN</span>
            </li>
          </ul>
          <hr th:if="${totals.size() > 0}">
          <div class="d-flex flex-wrap gap-3 font-monospace fw-semibold">
            <span th:each="t : ${totals}" th:text="${@money.format(t.value, t.key)}">1 200,00 BYN</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="card-body">
          <h2 class="h6 text-body-secondary text-uppercase small" th:text="#{dashboard.baseCurrency}">Базовая валюта</h2>
          <p class="fs-4 mb-1 font-monospace" th:text="${baseCurrency}">BYN</p>
          <p class="small text-body-secondary mb-0" th:text="#{dashboard.baseCurrencyHint}">Счета можно вести в любой валюте.</p>
        </div>
      </section>

      <section class="card" th:hx-get="@{/system/status}" hx-trigger="load" hx-swap="outerHTML">
        <div class="card-body small text-body-secondary" th:text="#{status.loading}">Проверяю…</div>
      </section>
    </div>
  </div>

  <section class="card" th:fragment="system-status" th:if="${status != null}">
    <div class="card-body">
      <h2 class="h6 text-body-secondary text-uppercase small" th:text="#{status.title}">Состояние</h2>
      <dl class="row small mb-0">
        <dt class="col-5 fw-normal text-body-secondary" th:text="#{status.database}">База данных</dt>
        <dd class="col-7 font-monospace" th:text="${status.database}">PostgreSQL 18.6</dd>
        <dt class="col-5 fw-normal text-body-secondary" th:text="#{status.schema}">Версия схемы</dt>
        <dd class="col-7 font-monospace" th:text="${status.schemaVersion} ?: #{status.schemaNone}">3</dd>
        <dt class="col-5 fw-normal text-body-secondary" th:text="#{status.java}">Java</dt>
        <dd class="col-7 font-monospace mb-0" th:text="${status.java}">25</dd>
      </dl>
    </div>
  </section>
</main>
</body>
</html>
