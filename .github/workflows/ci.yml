name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
      # spotlessCheck, компиляция и тесты (Testcontainers использует Docker раннера)
      - run: ./gradlew check
      - run: docker build -t spendings:ci .
