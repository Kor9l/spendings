<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d6870">
  <title>Нет связи · Spendings</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --fg: #212529; --muted: #6c757d; --accent: #0d6870; }
    @media (prefers-color-scheme: dark) { :root { --bg: #212529; --fg: #dee2e6; --muted: #adb5bd; --accent: #3fb6bf; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; box-sizing: border-box; }
    main { max-width: 26rem; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { font-size: 1.4rem; margin: 1rem 0 .5rem; }
    p { color: var(--muted); line-height: 1.5; }
    button { margin-top: 1rem; padding: .6rem 1.4rem; border: 0; border-radius: .5rem; background: var(--accent);
             color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>Нет связи с сервером</h1>
  <p>Данные хранятся на вашем сервере, а не в телефоне, поэтому без сети их не открыть. Проверьте интернет или VPN и попробуйте ещё раз.</p>
  <button type="button" onclick="location.reload()">Повторить</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
